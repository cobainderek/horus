name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: instalar deps mínimas
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install fastapi sqlalchemy psycopg2-binary pydantic httpx python-dotenv \
                      polars pandas scikit-learn joblib rapidfuzz networkx celery redis numpy

      - name: ruff (lint)
        run: ruff check backend/ || true   # warning-only por enquanto

      - name: import check (modelos + routers carregam)
        env:
          DATABASE_URL: "postgresql://horus:horus123@localhost:5433/horus"
        run: |
          python -c "from backend.api import main; print('main ok')"
          python -c "from backend.analytics import score, isolation_forest, fuzzy_match, grafo, nlp; print('analytics ok')"
          python -c "from backend import ingestao, cruzamento; print('cli ok')"
          python -c "from backend.tasks import celery_app, jobs; print('tasks ok')"

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm install --no-audit --no-fund

      - name: build
        run: npm run build
