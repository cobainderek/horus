services:
  db:
    image: postgres:16
    container_name: horus-db
    environment:
      POSTGRES_DB: horus
      POSTGRES_USER: horus
      POSTGRES_PASSWORD: horus123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
